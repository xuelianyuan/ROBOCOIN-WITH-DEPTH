<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Inspector</title><link rel="stylesheet" href="../tools/depth_inspector/style.css"></head>
<body><header><div><span class="eyebrow">ROBOCOIN / DATA QA</span><h1 id="title">Depth Inspector</h1></div><div class="header-tools"><div id="status" class="status">正在分析深度视频...</div><label class="pcd-frame-control"><span>点云帧</span><input id="pcd-frame" type="number" min="0" max="0" value="0" list="pcd-frame-options" inputmode="numeric"><datalist id="pcd-frame-options"></datalist><small id="pcd-frame-hint">可输入任意帧</small></label></div></header>
<main><section class="transport"><button id="play" title="播放/暂停">▶</button><input id="timeline" type="range" min="0" max="1" value="0"><output id="clock">帧 0 / 0 · 循环 1 / 3</output></section>
<section class="result-table" id="table"></section></main><script src="../tools/depth_inspector/app.js"></script></body></html>
